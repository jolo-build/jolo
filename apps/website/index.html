<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Jolo — Your agents. One workspace.</title>
    <meta name="description" content="Jolo brings coding agents, an inline browser, and a terminal into one workspace. Follow your tasks, inspect every edit, and pick up where you left off." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jolo.build/" />
    <link rel="canonical" href="https://jolo.build/" />
    <meta property="og:title" content="Jolo — Your agents. One workspace." />
    <meta property="og:description" content="A workspace for your coding agents, browser, and terminal. Built for focus, with every task and change in view." />
    <meta name="twitter:card" content="summary" />
    <style id="startup-style">
      #startup { display: none; }
      html[data-assets-loading] { background: #fcfcfb; }
      html[data-assets-loading] body { overflow: hidden; }
      html[data-assets-loading] #root { visibility: hidden !important; }
      html[data-assets-loading] #startup { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 16px; padding: 24px; color: #606060; background: #fcfcfb; font: 14px/1.5 system-ui, sans-serif; text-align: center; }
      #startup p { margin: 0; }
      #startup .startup-spinner { width: 22px; height: 22px; border: 2px solid #ddd; border-top-color: #111; border-radius: 50%; animation: startup-spin .8s linear infinite; }
      #startup .startup-error { display: none; }
      html[data-assets-error] #startup .startup-pending { display: none; }
      html[data-assets-error] #startup .startup-error { display: block; }
      #startup button { padding: 8px 16px; border: 1px solid #aaa; border-radius: 0; color: #111; background: #fcfcfb; font: inherit; cursor: pointer; }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #startup .startup-spinner { animation: none; } }
    </style>
    <script id="startup-script">
      // Hide the prerendered content before its first paint, even if CSS is slow.
      // With JavaScript disabled, the static HTML remains available.
      (() => {
        const root = document.documentElement;
        root.dataset.assetsLoading = '';
        let loaded = false, hydrated = false, started = false, failed = false;
        let errorMessage = 'Jolo is taking longer to load. Try again if loading does not finish.';
        const showError = message => {
          if (message) errorMessage = message;
          root.dataset.assetsError = '';
          const notice = document.querySelector('#startup p.startup-error');
          if (notice) notice.textContent = errorMessage;
        };
        // A stalled download gets a retry action, never a flash of unready content.
        const deadline = setTimeout(showError, 15000);
        window.addEventListener('error', event => {
          // Only Jolo's own build assets can block startup. Extensions and
          // optional resources must not keep an otherwise ready page hidden.
          const target = event.target;
          if (target?.matches?.('[data-jolo-asset], #root img:not([loading="lazy"])')) {
            failed = true;
            const resource = target.tagName === 'SCRIPT' ? 'app code' : target.tagName === 'LINK' ? 'stylesheet' : 'image';
            showError(`Jolo’s ${resource} couldn’t load. Try again or check whether your browser is blocking it.`);
          }
        }, true);
        document.addEventListener('click', event => {
          if (event.target.closest?.('#startup button')) window.location.reload();
        });
        const ready = async () => {
          if (!loaded || !hydrated || started || failed) return;
          started = true;
          try {
            const styles = [...document.querySelectorAll('link[rel="stylesheet"][data-jolo-asset]')];
            if (styles.some(link => !link.sheet)) throw new Error('Jolo’s stylesheet couldn’t load. Try again.');
            const faces = (await Promise.all(['Inter', 'JetBrains Mono'].map(family => document.fonts.load(`400 16px "${family}"`)))).flat();
            if (faces.length < 2) throw new Error('Jolo’s font couldn’t load. Check whether custom fonts are blocked, then try again.');
            await Promise.all([...document.querySelectorAll('#root img')].filter(image => image.loading !== 'lazy').map(image => image.decode()));
            // Allow font metrics and the hydrated layout to settle before revealing.
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            if (failed) return;
            clearTimeout(deadline);
            delete root.dataset.assetsLoading;
            delete root.dataset.assetsError;
            document.getElementById('startup').remove();
          } catch (error) {
            showError(error.message?.startsWith('Jolo’s') ? error.message : 'Jolo’s font or image couldn’t load. Check whether your browser is blocking it, then try again.');
          }
        };
        // DOM readiness plus hydration covers our modules and stylesheets.
        // The global load event also waits for unrelated injected resources.
        document.addEventListener('DOMContentLoaded', () => {
          loaded = true;
          if (root.hasAttribute('data-assets-error')) showError();
          void ready();
        }, { once: true });
        window.addEventListener('jolo:hydrated', () => { hydrated = true; void ready(); }, { once: true });
      })();
    </script>
    <link rel="preload" href="/fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/JetBrainsMono-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="startup" role="status" aria-live="polite">
      <span class="startup-spinner startup-pending" aria-hidden="true"></span>
      <p class="startup-pending">Loading Jolo…</p>
      <p class="startup-error">Jolo couldn’t finish loading. Try again.</p>
      <button class="startup-error" type="button">Try again</button>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx" data-jolo-asset></script>
  </body>
</html>

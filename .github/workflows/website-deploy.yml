name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/website-deploy.yml'
      - '.bun-version'
      - 'bun.lock'
      - 'apps/website/**'
      - 'assets/**'
      - 'deploy/website*'
      - 'deploy/github-releases.js'
      - 'deploy/cli-releases.json'
      - 'scripts/install.sh'
      - 'scripts/releases.js'
      - 'scripts/release-assets.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'jolo-build/jolo'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun test tests/release/release-routing.test.js tests/release/release-assets.test.js
      - name: Restore the original immutable website release
        run: bun run release:restore
      - run: bun run website:build
      - name: Deploy jolo.build
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set the CLOUDFLARE_API_TOKEN repository secret.' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Set the CLOUDFLARE_ACCOUNT_ID repository secret.' >&2; exit 1; }
          bunx --no-install wrangler deploy --config ../../deploy/website.wrangler.jsonc

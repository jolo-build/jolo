name: CLI and desktop releases

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: CLI / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/ci-release.js check-tag
      - run: bun install --frozen-lockfile
      - run: bun run setup:tgrep
      - name: Check installer, updates and release routing
        run: bun test tests/integration/installer.test.js tests/integration/cli-update.test.js tests/release/ci-release.test.js tests/release/release-assets.test.js tests/release/release-routing.test.js packages/updates/test/updates.test.js apps/cli/test/cli-update.test.js apps/desktop/test/release-updates.test.js
      - name: Build native CLI archive
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bun run build:cli
      - name: Install and run the built CLI without development tools on PATH
        run: bun scripts/smoke-install.js --dist dist
      - name: Prepare checked release assets
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: bun scripts/ci-release.js prepare dist release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  desktop:
    name: Desktop / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: windows-2022, target: win32-x64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # tgrep publishes no Windows binary; the engine falls back to live search there.
      - if: matrix.target != 'win32-x64'
        run: bun run setup:tgrep
      # The macOS bundle is ad-hoc signed; Windows and Linux archives are unsigned. Shipping the
      # signed route still needs a Developer ID signature and notarization, which is why the
      # application reports updates rather than installing them.
      - name: Build the desktop archive
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bun scripts/build.js
          bun apps/desktop/scripts/package.js --archive
        shell: bash
      - name: Prepare checked release assets
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_PRODUCT: desktop
        run: bun scripts/ci-release.js prepare dist/desktop release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish complete GitHub release
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify all platforms, upload to a draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/ci-release.js publish release-assets

  homebrew-tap:
    name: Update Homebrew tap
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: Skip when no tap token is configured
        id: gate
        if: env.TAP_TOKEN == ''
        run: echo '::notice::TAP_GITHUB_TOKEN is not set; skipping the Homebrew tap update.'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: env.TAP_TOKEN != ''
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: env.TAP_TOKEN != ''
        with:
          repository: jolo-build/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: env.TAP_TOKEN != ''
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.TAP_TOKEN != ''
        with:
          pattern: 'cli-*'
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.TAP_TOKEN != ''
        with:
          pattern: 'desktop-*'
          path: release-assets
          merge-multiple: true
      - name: Render and push the updated formula and cask
        if: env.TAP_TOKEN != ''
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bun scripts/update-homebrew-tap.js "${RELEASE_TAG#v}" release-assets --out homebrew-tap
          cd homebrew-tap
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Tap is already up to date.'
            exit 0
          fi
          git add Formula Casks
          git -c user.name='jolo-release-bot' -c user.email='releases@jolo.build' commit -m "Jolo ${RELEASE_TAG}"
          git push

  npm-publish:
    name: Publish jolo-cli to npm
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip when no npm token is configured
        if: env.NPM_TOKEN == ''
        run: echo '::notice::NPM_TOKEN is not set; skipping the npm publish.'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: env.NPM_TOKEN != ''
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        if: env.NPM_TOKEN != ''
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish the installer package
        if: env.NPM_TOKEN != ''
        working-directory: apps/cli/npm
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
          npm publish --access public
